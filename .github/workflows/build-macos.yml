name: Build - macOS

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
      - debian-ci-test
  workflow_dispatch:
    inputs:
      debug_enabled:
        description: "Run with debugging enabled"
        required: false
        default: false

permissions:
  contents: read

env:
  BUILDTHREADS: 4
  XCODE_APP: Xcode.app

jobs:
  build:
    name: macOS Xcode Build (${{ matrix.platform_dir }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    env:
      CCACHE_DIR: /Users/runner/.ccache-kodi-${{ matrix.platform_dir }}
      CCACHE_MAXSIZE: 2G
      CCACHE_COMPRESS: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform_dir: osx64
            runner: macos-13
          - platform_dir: osx-arm64
            runner: macos-14

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          brew update
          brew install autoconf automake libtool pkg-config ccache swig

      - name: Restore ccache from GitHub cache
        id: ccache-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ matrix.platform_dir }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ matrix.platform_dir }}-

      - name: Configure ccache
        run: |
          mkdir -p "${{ env.CCACHE_DIR }}"
          ccache -M "${{ env.CCACHE_MAXSIZE }}"
          ccache -o compression="${{ env.CCACHE_COMPRESS }}"
          ccache -z

      - name: Prepare macOS shared directories
        run: |
          mkdir -p /Users/Shared/xbmc-depends/tarballs

      - name: Prepare depends
        run: |
          tools/buildsteps/${{ matrix.platform_dir }}/prepare-depends

      - name: Configure depends
        run: |
          tools/buildsteps/${{ matrix.platform_dir }}/configure-depends

      - name: Build native depends
        run: |
          tools/buildsteps/${{ matrix.platform_dir }}/make-native-depends

      - name: Build depends
        run: |
          tools/buildsteps/${{ matrix.platform_dir }}/make-depends

      - name: Prepare Kodi build tree
        run: |
          tools/buildsteps/${{ matrix.platform_dir }}/prepare-xbmc

      - name: Configure Kodi Xcode project
        run: |
          tools/buildsteps/${{ matrix.platform_dir }}/configure-xbmc

      - name: Build Kodi
        run: |
          tools/buildsteps/${{ matrix.platform_dir }}/make-xbmc

      - name: Run tests
        run: |
          tools/buildsteps/${{ matrix.platform_dir }}/run-tests

      - name: Package DMG
        run: |
          tools/buildsteps/${{ matrix.platform_dir }}/package

      - name: Display ccache statistics
        if: always()
        run: |
          ccache -s

      - name: Save ccache to GitHub cache
        if: always() && steps.ccache-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.ccache-cache.outputs.cache-primary-key }}

      - name: Upload DMG artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: kodi-macos-${{ matrix.platform_dir }}
          path: tools/darwin/packaging/osx/*.dmg
          if-no-files-found: warn

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: kodi-macos-tests-${{ matrix.platform_dir }}
          path: gtestresults.xml
          if-no-files-found: warn
