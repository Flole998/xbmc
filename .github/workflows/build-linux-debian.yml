name: Build - Linux Debian

# Trigger conditions
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
      - debian-ci-test
  workflow_dispatch:
    inputs:
      debug_enabled:
        description: 'Run with debugging enabled'
        required: false
        default: false

permissions:
  contents: read

# Environment variables
env:
  CMAKE_BUILD_DIR: ./build
  CMAKE_INSTALL_PREFIX: /usr/local
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 1G
  CCACHE_COMPRESS: true
  PARALLEL_JOBS: 4

jobs:
  build:
    name: Linux Debian Build
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for better build info

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y debhelper autoconf automake autopoint gettext autotools-dev cmake curl default-jre doxygen gawk gcc gdc gperf libasound2-dev libass-dev libavahi-client-dev libavahi-common-dev libbluetooth-dev libbluray-dev libbz2-dev libcdio-dev libcdio++-dev libp8-platform-dev libcrossguid-dev libcurl4-openssl-dev libcwiid-dev libdbus-1-dev libdrm-dev libegl1-mesa-dev libenca-dev libexiv2-dev libflac-dev libfmt-dev libfontconfig-dev libfreetype6-dev libfribidi-dev libfstrcmp-dev libgcrypt-dev libgif-dev libgles2-mesa-dev libgl1-mesa-dev libglu1-mesa-dev libgnutls28-dev libgpg-error-dev libgtest-dev libiso9660-dev libjpeg-dev liblcms2-dev libltdl-dev liblzo2-dev libmicrohttpd-dev libmysqlclient-dev libnfs-dev libogg-dev libpcre2-dev libplist-dev libpng-dev libpulse-dev libshairplay-dev libsmbclient-dev libspdlog-dev libsqlite3-dev libssl-dev libtag1-dev libtiff5-dev libtinyxml-dev libtinyxml2-dev libtool libudev-dev libunistring-dev libva-dev libvdpau-dev libvorbis-dev libxmu-dev libxrandr-dev libxslt1-dev libxt-dev lsb-release meson nasm ninja-build nlohmann-json3-dev python3-dev python3-pil python3-pip swig unzip uuid-dev zip zlib1g-dev
          sudo apt install -y libcec-dev libfmt-dev liblirc-dev
          sudo apt install -y libflatbuffers-dev
          sudo apt install -y libglew-dev libwayland-dev libxkbcommon-dev waylandpp-dev wayland-protocols
          sudo apt install -y libgbm-dev libinput-dev libxkbcommon-dev
          sudo apt install -y doxygen libcap-dev libsndio-dev libmariadbd-dev
          sudo apt install -y libdisplay-info-dev

      - name: Install ccache
        run: |
            sudo apt install -y ccache

      - name: Restore ccache from GitHub cache
        id: ccache-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-debian-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-debian-${{ github.ref_name }}-
            ccache-${{ runner.os }}-debian-

      - name: Configure ccache
        run: |
          mkdir -p "${{ env.CCACHE_DIR }}"
          ccache -M "${{ env.CCACHE_MAXSIZE }}"
          ccache -o compression="${{ env.CCACHE_COMPRESS }}"

      - name: Build all dependencies
        run: |
          cd tools/depends
          #./bootstrap
          #./configure --prefix=/opt/xbmc-depends --with-rendersystem=gl
          #make -j${{ env.PARALLEL_JOBS }}

      - name: Create build directory
        run: |
          mkdir -p ${{ env.CMAKE_BUILD_DIR }}

      - name: Configure Kodi build (CMake)
        run: |
          cd ${{ env.CMAKE_BUILD_DIR }}
          cmake .. \
            -DCMAKE_INSTALL_PREFIX=${{ env.CMAKE_INSTALL_PREFIX }} \
            -DCORE_PLATFORM_NAME="x11 wayland gbm" \
            -DAPP_RENDER_SYSTEM=gl \
            -DENABLE_INTERNAL_FLATBUFFERS=ON \
            -DENABLE_INTERNAL_CROSSGUID=ON \
            -DENABLE_INTERNAL_FMT=ON \
            -DENABLE_INTERNAL_SPDLOG=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_INTERNAL_FFMPEG=ON

      - name: Build Kodi
        run: |
          cd ${{ env.CMAKE_BUILD_DIR }}
          cmake --build . \
            --parallel ${{ env.PARALLEL_JOBS }} \
            --verbose

      - name: Display ccache statistics
        run: |
          ccache -s

      - name: Save ccache to GitHub cache
        if: always() && steps.ccache-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.ccache-cache.outputs.cache-primary-key }}

      - name: Check build artifacts
        run: |
          ls -lh ${{ env.CMAKE_BUILD_DIR }}

  build-android:
    name: Android Build (${{ matrix.android_abi }})
    runs-on: ubuntu-latest
    env:
      PARALLEL_JOBS: 4
      CCACHE_DIR: ${{ github.workspace }}/.ccache-android-${{ matrix.android_abi }}
      CCACHE_MAXSIZE: 1G
      CCACHE_COMPRESS: true
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - android_abi: armeabi-v7a
            android_host: arm-linux-androideabi
          - android_abi: arm64-v8a
            android_host: aarch64-linux-android
          - android_abi: x86
            android_host: i686-linux-android
          - android_abi: x86_64
            android_host: x86_64-linux-android

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Android build dependencies
        run: |
          sudo apt update
          sudo apt install -y ant ant-optional autoconf automake autopoint ccache cmake curl default-jdk-headless gettext gawk libcurl4-gnutls-dev libtool make nasm ninja-build pkg-config unzip zip

      - name: Restore Android ccache from GitHub cache
        id: ccache-cache-android
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-android-${{ matrix.android_abi }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-android-${{ matrix.android_abi }}-${{ github.ref_name }}-
            ccache-${{ runner.os }}-android-${{ matrix.android_abi }}-

      - name: Configure Android ccache
        run: |
          mkdir -p "${{ env.CCACHE_DIR }}"
          ccache -M "${{ env.CCACHE_MAXSIZE }}"
          ccache -o compression="${{ env.CCACHE_COMPRESS }}"

      - name: Verify Java/Ant toolchain
        run: |
          java -version
          javac -version
          ant -version
          test -f /usr/share/ant/lib/ant-launcher.jar
          JAVAC_PATH="$(readlink -f "$(command -v javac)")"
          JAVA_BIN_DIR="$(dirname "${JAVAC_PATH}")"
          JAVA_HOME="$(dirname "${JAVA_BIN_DIR}")"
          echo "JAVA_HOME=${JAVA_HOME}" >> "${GITHUB_ENV}"
          echo "ANT_HOME=/usr/share/ant" >> "${GITHUB_ENV}"
          echo "PATH=/usr/share/ant/bin:${PATH}" >> "${GITHUB_ENV}"

      - name: Setup Android SDK/NDK
        env:
          NDK_VERSION: 28.2.13676358
          # Minimum Android API level used for NDK toolchain/dependencies
          NDK_API: 24
          TARGET_SDK: 36
          BUILD_TOOLS: 36.0.0
        run: |
          if [ -n "${ANDROID_SDK_ROOT}" ]; then
            SDK_PATH="${ANDROID_SDK_ROOT}"
          elif [ -n "${ANDROID_HOME}" ]; then
            SDK_PATH="${ANDROID_HOME}"
          elif [ -d "/usr/local/lib/android/sdk" ]; then
            SDK_PATH="/usr/local/lib/android/sdk"
          else
            echo "Unable to find Android SDK path"
            exit 1
          fi

          if [ -x "${SDK_PATH}/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="${SDK_PATH}/cmdline-tools/latest/bin/sdkmanager"
          elif [ -x "${SDK_PATH}/cmdline-tools/bin/sdkmanager" ]; then
            SDKMANAGER="${SDK_PATH}/cmdline-tools/bin/sdkmanager"
          else
            echo "Unable to locate sdkmanager under ${SDK_PATH}"
            exit 1
          fi

          yes | "${SDKMANAGER}" --licenses >/dev/null
          "${SDKMANAGER}" \
            "platform-tools" \
            "ndk;${NDK_VERSION}" \
            "platforms;android-${TARGET_SDK}" \
            "build-tools;${BUILD_TOOLS}"

          echo "SDK_PATH=${SDK_PATH}" >> "${GITHUB_ENV}"
          echo "NDK_PATH=${SDK_PATH}/ndk/${NDK_VERSION}" >> "${GITHUB_ENV}"
          echo "NDK_API=${NDK_API}" >> "${GITHUB_ENV}"

      - name: Build Android depends (${{ matrix.android_abi }})
        run: |
          cd tools/depends
          ./bootstrap
          ./configure \
            --with-tarballs="${GITHUB_WORKSPACE}/.android-tarballs" \
            --host=${{ matrix.android_host }} \
            --with-sdk-path="${SDK_PATH}" \
            --with-ndk-path="${NDK_PATH}" \
            --with-ndk-api="${NDK_API}" \
            --prefix="${GITHUB_WORKSPACE}/tools/depends/xbmc-depends"
          make -j"${PARALLEL_JOBS}"

      - name: Configure Android Kodi build (${{ matrix.android_abi }})
        run: |
          make -C tools/depends/target/cmakebuildsys BUILD_DIR="${GITHUB_WORKSPACE}/build-android-${{ matrix.android_abi }}"

      - name: Build Android Kodi (${{ matrix.android_abi }})
        run: |
          cd "${GITHUB_WORKSPACE}/build-android-${{ matrix.android_abi }}"
          make -j"${PARALLEL_JOBS}"

      - name: Check Android build artifacts (${{ matrix.android_abi }})
        run: |
          ls -lh "${GITHUB_WORKSPACE}/build-android-${{ matrix.android_abi }}"

      - name: Display Android ccache statistics
        run: |
          ccache -s

      - name: Save Android ccache to GitHub cache
        if: always() && steps.ccache-cache-android.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.ccache-cache-android.outputs.cache-primary-key }}
