name: Build - Windows

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
      - debian-ci-test
  workflow_dispatch:

permissions:
  contents: read

env:
  KODI_MIRROR: https://mirrors.kodi.tv
  CCACHE_DIR: ${{ github.workspace }}\.ccache
  CCACHE_CACHE_SIZE: 1G

jobs:
  build:
    name: Windows Build
    runs-on: windows-2022
    timeout-minutes: 240

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore ccache from GitHub cache
        id: ccache-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ github.ref_name }}-
            ccache-${{ runner.os }}-

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2

      - name: Download Windows dependencies
        shell: cmd
        run: |
          cd tools\buildsteps\windows\x64
          call download-dependencies.bat
          if errorlevel 1 exit /b 1

      - name: Setup Windows build environment
        shell: cmd
        run: |
          cd tools\buildsteps\windows\x64
          call download-msys2.bat
          if errorlevel 1 exit /b 1

      - name: Build Kodi installer
        shell: cmd
        run: |
          cd tools\buildsteps\windows\x64
          call BuildSetup.bat nobinaryaddons clean noprompt
          if errorlevel 1 exit /b 1

      - name: Save ccache to GitHub cache
        if: always() && steps.ccache-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.ccache-cache.outputs.cache-primary-key }}

      - name: Check build artifacts
        shell: cmd
        run: |
          dir project\Win32BuildSetup\*Setup-*.exe

      - name: Upload installer artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: kodi-windows-installer
          path: project/Win32BuildSetup/*Setup-*.exe
          if-no-files-found: warn
